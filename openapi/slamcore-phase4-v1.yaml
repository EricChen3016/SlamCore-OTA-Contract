          description: 'Authenticated caller not authorized for adjacent peer, target,
            or read scope: UNAUTHORIZED_PEER.'
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/error-response.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/error-403.json
        '404':
          description: 'Unknown resource: RESOURCE_NOT_FOUND. Query 404 alone does
            not terminalize an uncertain obligation.'
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/error-response.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/error-404.json
        '409':
          description: IDEMPOTENCY_CONFLICT, INVALID_TOPOLOGY, STALE_ROUTE, ROUTE_MISMATCH,
            INVALID_ADJACENCY or UPDATE_ALREADY_RUNNING; no durable acceptance/downstream
            mutation of the rejected request. A first matching STALE_ROUTE, ROUTE_MISMATCH or
            INVALID_ADJACENCY rejection may be durably captured by the parent as
            firstSubmissionRejected proof; no child command receipt is invented.
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/error-response.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/error-409.json
        '422':
          description: CAPABILITY_MISMATCH or INCOMPATIBLE_RELEASE; never silently
            downgrade. A first matching CAPABILITY_MISMATCH rejection may be
            captured in parent firstSubmissionRejected proof. See normative section 7.1.
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/error-response.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/error-422.json
        '503':
          description: DEPENDENCY_UNAVAILABLE; retry same operation after query/reconciliation.
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/error-response.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/error-503.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/phase4/routed-command.schema.json
            examples:
              canonical:
                externalValue: ../examples/phase4/n-hop-update.json
  /commands/{serverCommandJobId}:
    get:
      operationId: AgentQueryCommandReceipt
      summary: query command receipt
      description: Authorized immediate upstream peer queries durable original acceptance
        plus current obligationState. receiptId identifies the obligation; this read
        snapshot may advance state without overwriting the original POST acceptance.
        A firstSubmissionRejected event freezes its own terminal receipt snapshot.
        Stored command is immutable; GET 404 does not
        prove absence of downstream acceptance. Query then exact replay on uncertain
        outcome.
      x-owner: Agent
      x-authenticated-peer-required: true
      servers:
      - url: https://agent.example.test/api/v1/phase4
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ContractVersion'
      - $ref: '#/components/parameters/RelayCapability'
      - name: serverCommandJobId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
      responses:
        '200':
          description: Durable read snapshot. Absence of evidence is unproven, never
            a physical exactly-once claim.
          content:
            application/json:
              schema:
