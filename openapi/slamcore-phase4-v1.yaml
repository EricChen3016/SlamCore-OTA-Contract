  /commands/{serverCommandJobId}/events:
    post:
      operationId: AgentRelayStatusEvent
      summary: relay status event
      description: Only immediate child Agent on retained snapshot. Key event:<serverCommandJobId>:<statusEventId>.
        Fingerprint excludes hopContext only, preserving every semantic observation
        byte. Persist and dedupe before upstream forward and acknowledgment. No Server
        sequence allocated by relay. A notObserved failure carries the complete immutable
        original never-forwarded originReceipt and originReceiptHash inside failureEvidence;
        every relay validates and retains the child-authenticated proof unchanged.
        No direct origin bypass or out-of-band proof channel.
      x-owner: Agent
      x-authenticated-peer-required: true
      servers:
      - url: https://agent.example.test/api/v1/phase4
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ContractVersion'
      - $ref: '#/components/parameters/RelayCapability'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: serverCommandJobId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
      responses:
        '204':
          description: Durably recorded or exact replay; no response body.
        '400':
          description: 'Malformed request or missing required header: VALIDATION_FAILED.'
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/error-response.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/error-400.json
        '401':
