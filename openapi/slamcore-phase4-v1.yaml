        '503':
          description: DEPENDENCY_UNAVAILABLE; retry same operation after query/reconciliation.
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/error-response.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/error-503.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/phase4/routed-status-event.schema.json
            examples:
              canonical:
                externalValue: ../examples/phase4/routed-status-event.json
              firstSubmissionRejected:
                externalValue: ../examples/phase4/first-submission-rejected-event.json
    get:
      operationId: AgentQueryDurableStatusEvents
      summary: query durable status events
      description: Read by authorized immediate upstream peer; event bodies retain
        original immutable observation and original incoming hopContext. On forwarding,
        generate the deterministic next upstream hop envelope only. Stable order (observedAtUtc,statusEventId)
