  /commands:
    post:
      operationId: AgentAcceptRoutedCommand
      summary: accept routed command
      description: Authenticated Server at Root, or immediate parent Agent. Key command:<serverCommandJobId>,
        scope receiving Agent. Complete command excluding hopContext is the immutable
        job fingerprint; hopContext is independently fixed and authenticated. Persist
        before forwarding AND before response. The body is never submitted to Updater.
      x-owner: Agent
      x-authenticated-peer-required: true
      servers:
      - url: https://agent.example.test/api/v1/phase4
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ContractVersion'
      - $ref: '#/components/parameters/RelayCapability'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Durably accepted before acknowledgment; pending downstream
            obligation retained. This original acceptance body is retained byte-for-byte
            for POST replay; a later terminal proof snapshot does not overwrite it.
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/command-receipt.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/command-receipt.json
        '200':
          description: 'Same key and semantic fingerprint: original durable acceptance
            replay.'
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/command-receipt.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/command-receipt.json
        '400':
          description: 'Malformed request or missing required header: VALIDATION_FAILED.'
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/error-response.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/error-400.json
