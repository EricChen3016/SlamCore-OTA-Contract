components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      description: Per HTTP hop/attempt UUID, accepting valid lowercase, uppercase,
        and mixed-case spellings in the canonical 8-4-4-4-12 UUID structure.
        ErrorResponse.correlationId MUST echo the exact
        valid header string without lowercasing or any other normalization. Never
        replaces the canonical lowercase operationCorrelationId. Missing/malformed
        header returns VALIDATION_FAILED with a generated diagnostic UUID when no
        valid echo is possible.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
        maxLength: 36
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Endpoint-specific exact scope/key in operation description and
        normative replay table. Retries reuse key and semantic payload.
      schema:
        type: string
        minLength: 1
        maxLength: 300
    ContractVersion:
      name: X-SlamCore-Contract-Version
      in: header
      required: true
      schema:
        type: string
        const: '2.0'
      description: 'Exact negotiated value required; unknown version or capability
        returns 422 with no mutation or route-critical delivery. Header assertion
        alone is not proof: receiver checks authenticated persisted capability evidence.'
    RelayCapability:
      name: X-SlamCore-Capability
      in: header
      required: true
      schema:
        type: string
        const: hierarchical-relay-v1
      description: 'Exact negotiated value required; unknown version or capability
        returns 422 with no mutation or route-critical delivery. Header assertion
        alone is not proof: receiver checks authenticated persisted capability evidence.'
    EvidenceCapability:
      name: X-SlamCore-Capability
      in: header
      required: true
      schema:
        type: string
        const: physical-operation-evidence-v1
      description: 'Exact negotiated value required; unknown version or capability
        returns 422 with no mutation or route-critical delivery. Header assertion
        alone is not proof: receiver checks authenticated persisted capability evidence.'
    EvidenceJournalId:
      name: journalId
      in: query
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
      description: Send journalId and journalHighWatermark together on every continuation
        or exact snapshot replay. Both may be absent only for a fresh first page with
        afterJournalSequence=0. Never silently select a new live snapshot. Mismatch
        or unavailable binding returns 409 EVIDENCE_SNAPSHOT_MISMATCH.
    EvidenceHighWatermark:
      name: journalHighWatermark
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
      description: Send journalId and journalHighWatermark together on every continuation
        or exact snapshot replay. Both may be absent only for a fresh first page with
        afterJournalSequence=0. Never silently select a new live snapshot. Mismatch
        or unavailable binding returns 409 EVIDENCE_SNAPSHOT_MISMATCH.
