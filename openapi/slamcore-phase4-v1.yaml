openapi: 3.1.0
info:
  title: SlamCore Phase 4 ViaAgent additive interfaces
  version: 2.2.0
  description: 'Normative rules: ../docs/phase4-viaagent.md. Runtime contractVersion
    remains 2.0. hierarchical-relay-v1 is required on every Agent; physical-operation-evidence-v1
    on Updater. Existing Contract 2.0 endpoints and owners are unchanged. Authentication
    is supplied by deployment trust configuration, never a claimed JSON identity.'
paths:
  /agents/observations:
    post:
      operationId: ServerRegisterAgentObservation
      summary: register agent observation
      description: Key observation:<originAgentId>:<observationEventId>; fingerprint
        is complete original observation. Registration is Agent-scoped and supports
        zero Devices. Observation does not change authority without Server acceptance.
        See docs/phase4-viaagent.md section 2.
      x-owner: Server
      x-authenticated-peer-required: true
      servers:
      - url: https://server.example.test/api/v1/phase4
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ContractVersion'
      - $ref: '#/components/parameters/RelayCapability'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Durably recorded or exact replay; no response body.
        '400':
          description: 'Malformed request or missing required header: VALIDATION_FAILED.'
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/error-response.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/error-400.json
                lowercase:
                  externalValue: ../examples/phase4/error-correlation-lowercase.json
                mixedcase:
                  externalValue: ../examples/phase4/error-correlation-mixedcase.json
                uppercase:
                  externalValue: ../examples/phase4/error-correlation-uppercase.json
        '401':
          description: 'Unauthenticated caller: UNAUTHORIZED_PEER.'
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/error-response.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/error-401.json
        '403':
          description: 'Authenticated caller not authorized for adjacent peer, target,
            or read scope: UNAUTHORIZED_PEER.'
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/error-response.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/error-403.json
        '404':
          description: 'Unknown resource: RESOURCE_NOT_FOUND. Query 404 alone does
            not terminalize an uncertain obligation.'
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/error-response.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/error-404.json
        '409':
          description: IDEMPOTENCY_CONFLICT, INVALID_TOPOLOGY, STALE_ROUTE, ROUTE_MISMATCH,
            INVALID_ADJACENCY or UPDATE_ALREADY_RUNNING; no durable acceptance/downstream
            mutation of the rejected request.
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/error-response.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/error-409.json
        '422':
          description: CAPABILITY_MISMATCH or INCOMPATIBLE_RELEASE; never silently
            downgrade.
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/error-response.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/error-422.json
        '503':
          description: DEPENDENCY_UNAVAILABLE; retry same operation after query/reconciliation.
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/error-response.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/error-503.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/phase4/agent-observation.schema.json
            examples:
              canonical:
                externalValue: ../examples/phase4/agent-observation.json
  /topology:
    get:
      operationId: ServerReadAuthoritativeTopology
      summary: read authoritative topology
      description: Authorized control-plane read of the current rooted forest revision;
        never substitutes for a retained accepted job snapshot.
      x-owner: Server
      x-authenticated-peer-required: true
      servers:
      - url: https://server.example.test/api/v1/phase4
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ContractVersion'
      - $ref: '#/components/parameters/RelayCapability'
      responses:
        '200':
          description: Durable read snapshot. Absence of evidence is unproven, never
            a physical exactly-once claim.
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/topology.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/topology.json
        '400':
          description: 'Malformed request or missing required header: VALIDATION_FAILED.'
