                canonical:
                  externalValue: ../examples/phase4/error-503.json
  /agents/{agentId}/commands:
    get:
      operationId: ServerReadPendingRoutedCommands
      summary: read pending routed commands
      description: Authenticated snapshot Root Agent only. Server filters exact current
        capabilities and expiry, retaining stable command identity. Stable cursor
        order is (createdAtUtc, serverCommandJobId); each page is an immutable read
        watermark. No acquisition acknowledgement is inferred from GET.
      x-owner: Server
      x-authenticated-peer-required: true
      servers:
      - url: https://server.example.test/api/v1/phase4
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ContractVersion'
      - $ref: '#/components/parameters/RelayCapability'
      - name: agentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Durable read snapshot. Absence of evidence is unproven, never
            a physical exactly-once claim.
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/pending-page.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/pending-page.json
        '204':
          description: Known Agent with no eligible unexpired command. No mutation
            or identity allocation.
        '400':
          description: 'Malformed request or missing required header: VALIDATION_FAILED.'
          content:
            application/json:
