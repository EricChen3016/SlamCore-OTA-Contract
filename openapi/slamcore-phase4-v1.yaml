            or read scope: UNAUTHORIZED_PEER.'
          content:
            application/json:
              schema:
                $ref: ../schemas/phase4/error-response.schema.json
              examples:
                canonical:
                  externalValue: ../examples/phase4/error-403.json
        '404':
          description: 'Unknown resource: RESOURCE_NOT_FOUND. Query 404 alone does
            not terminalize an uncertain obligation.'
          content:
