openapi: 3.1.0
info:
  title: SlamCore Updater API
  version: 2.0.1
  description: Internal HTTP contract; package integrity is enforced with SHA-256.
servers:
  - url: http://{jetsonHost}:5000/api/v1
    variables:
      jetsonHost: {default: jetson.local}
paths:
  /status:
    get:
      operationId: getUpdaterStatus
      responses:
        '200':
          description: Current service status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceStatus'}
  /update:
    post:
      operationId: startUpdate
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/updater-api/update-request.schema.json'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /update/{jobId}:
    get:
      operationId: getUpdate
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Update status
          content:
            application/json:
              schema: {$ref: '../schemas/common/update-status.schema.json'}
        '404': {$ref: '#/components/responses/Error'}
  /rollback:
    post:
      operationId: rollbackUpdate
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contractVersion, jobId]
              properties:
                contractVersion: {const: '2.0'}
                jobId: {$ref: '#/components/schemas/JobId'}
              additionalProperties: true
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
components:
  parameters:
    ContractVersion:
      name: X-SlamCore-Contract-Version
      in: header
      required: true
      schema: {const: '2.0'}
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      description: Correlates this JSON request across Contract participants.
      schema: {type: string}
      example: 7d6a89e0-7a99-4da6-a281-8e58d7252540
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 200}
    JobId:
      name: jobId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/JobId'}
  schemas:
    JobId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}
    State:
      enum: [idle, queued, checking, downloading, verifying, backing_up, installing, restarting, health_checking, completed, failed, rolling_back, rolled_back]
    ServiceStatus:
      type: object
      required: [contractVersion, serviceVersion, platform, currentReleaseVersion, state, activeJobId, dockerStatus, healthy]
      properties:
        contractVersion: {const: '2.0'}
        serviceVersion: {type: string}
        platform: {type: string}
        currentReleaseVersion: {type: string}
        state: {$ref: '#/components/schemas/State'}
        activeJobId: {oneOf: [{$ref: '#/components/schemas/JobId'}, {type: 'null'}]}
        dockerStatus: {enum: [running, stopped, unavailable]}
        healthy: {type: boolean}
      additionalProperties: true
      example:
        contractVersion: '2.0'
        serviceVersion: 1.0.0
        platform: jetson-orin
        currentReleaseVersion: 1.0.5
        state: idle
        activeJobId: null
        dockerStatus: running
        healthy: true
    Accepted:
      type: object
      required: [jobId, accepted, state, statusUrl]
      properties:
        jobId: {$ref: '#/components/schemas/JobId'}
        accepted: {type: boolean}
        state: {$ref: '#/components/schemas/State'}
        statusUrl: {type: string, format: uri-reference}
      additionalProperties: true
  responses:
    Accepted:
      description: Operation accepted; repeated identical idempotency keys return the same job.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Accepted'}
    Error:
      description: Contract error
      content:
        application/problem+json:
          schema: {$ref: '../schemas/common/error-response.schema.json'}
